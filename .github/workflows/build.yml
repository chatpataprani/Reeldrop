name: Build Reeldrop APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK integrity
        run: |
          set -e
          APK="$(find app/build/outputs/apk -type f -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$APK"
          echo "Using APK: $APK"
          ls -lh "$APK"
          file "$APK"
          unzip -t "$APK"
          sha256sum "$APK"
          cp "$APK" yawr-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yawr-debug-apk
          path: yawr-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="yawr-latest"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" yawr-debug.apk               --title "yawr Latest Build"               --notes "Automatically published from the latest successful main-branch build."               --prerelease
          else
            gh release upload "$TAG" yawr-debug.apk --clobber
          fi

      - name: Write APK download link
        run: |
          echo "## yawr APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the latest yawr APK](https://github.com/chatpataprani/Reeldrop/releases/download/reeldrop-latest/yawr-debug.apk)" >> "$GITHUB_STEP_SUMMARY"
