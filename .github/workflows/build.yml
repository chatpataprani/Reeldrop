name: Build Reeldrop APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build arm64 release APK
        run: ./gradlew --no-daemon assembleGenericRelease -PnoSplits

      - name: Verify APK integrity
        run: |
          set -e
          mapfile -t APKS < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one APK, found ${#APKS[@]}"
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi
          APK="${APKS[0]}"
          echo "Using APK: $APK"
          ls -lh "$APK"
          file "$APK"
          python3 - "$APK" <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt APK entry: {bad}")
          print("Python ZIP integrity check: OK")
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          cp "$APK" yawr.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yawr-apk
          path: yawr.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="yawr-latest"
          VERSION="$(python3 -c 'import re; s=open("buildSrc/src/main/kotlin/Version.kt").read(); m=re.search(r"currentVersion:\\s*Version\\.([A-Za-z]+)\\(versionMajor = (\\d+), versionMinor = (\\d+), versionPatch = (\\d+)(?:, versionBuild = (\\d+))?\\)", s); assert m, "Could not read currentVersion"; kind,ma,mi,pa,b=m.groups(); print(f"{ma}.{mi}.{pa}" + (f"-{kind.lower()}.{b or 0}" if kind.lower() != "stable" else ""))')"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" yawr.apk               --title "$VERSION"               --notes "Automatically published from the latest successful main-branch build."               --latest
          else
            gh release edit "$TAG" --title "$VERSION" --prerelease=false --latest
            gh release upload "$TAG" yawr.apk --clobber
          fi

      - name: Write APK download link
        run: |
          echo "## yawr APK (arm64 release)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the latest yawr APK](https://github.com/chatpataprani/Reeldrop/releases/download/yawr-latest/yawr.apk)" >> "$GITHUB_STEP_SUMMARY"
