name: Build Reeldrop APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK integrity
        run: |
          set -e
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep -i 'generic' | head -n 1)"
          test -n "$APK"
          echo "Using APK: $APK"
          ls -lh "$APK"
          file "$APK"
          unzip -t "$APK"
          sha256sum "$APK"
          cp "$APK" reeldrop-debug.apk

      - name: Upload Reeldrop APK
        uses: actions/upload-artifact@v4
        with:
          path: reeldrop-debug.apk
          if-no-files-found: error
          archive: false
